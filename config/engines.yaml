# Engine settings for aeo-audit.
#
# Every model ID, API parameter and price below was checked against each
# provider's official documentation. Re-check before relying on cost estimates:
# model names and prices change often.
#
# Prices are USD. Token prices are per 1 million tokens.
# Estimates per call (tokens, searches) are planning assumptions, not prices.

engines:
  openai:
    display_name: OpenAI
    verified: "2026-11-07"
    docs:
      - https://developers.openai.com/api/docs/pricing
      - https://developers.openai.com/api/docs/guides/tools-web-search
      - https://developers.openai.com/api/docs/models/gpt-6-luna
    api_key_env: OPENAI_API_KEY
    model: gpt-6-luna
    api: responses                    # Responses API (web search requires it)
    search:
      enabled: true
      tool: web_search                # tools: [{"type": "web_search"}]
      search_context_size: medium     # documented default
      max_searches_per_call: 2        # sent as max_tool_calls
    concurrency: 6
    timeout_seconds: 90
    pricing:
      input_per_mtok: 0.10
      output_per_mtok: 0.50
      search_per_call: 0.010          # $10 per 1,000 web search calls
    estimate:                         # planning assumptions per answer
      input_tokens: [4000, 20000]     # prompt plus search content tokens
      output_tokens: [500, 1500]
      searches: [1, 2]

  anthropic:
    display_name: Anthropic Claude
    verified: "2026-11-07"
    docs:
      - https://platform.claude.com/docs/en/about-claude/pricing
      - https://platform.claude.com/docs/en/agents-and-tools/tool-use/web-search-tool
    api_key_env: ANTHROPIC_API_KEY
    model: claude-haiku-5-5
    api: messages
    search:
      enabled: true
      tool: web_search_20250305       # basic web search, predictable token use
      max_searches_per_call: 2        # sent as max_uses
    concurrency: 5
    timeout_seconds: 120
    pricing:
      input_per_mtok: 0.10            # prompts up to 100,000 tokens
      output_per_mtok: 0.50
      search_per_call: 0.010          # $10 per 1,000 searches
    estimate:
      input_tokens: [8000, 30000]     # search results count as input tokens
      output_tokens: [500, 1500]
      searches: [1, 2]

  gemini:
    display_name: Google Gemini
    verified: "2026-11-07"
    docs:
      - https://aistudio.google.com/docs/pricing
      - https://aistudio.google.com/docs/google-search
    api_key_env: GEMINI_API_KEY
    model: gemini-3.8-flash
    api: interactions                 # client.interactions.create
    search:
      enabled: true
      tool: google_search             # tools: [{"type": "google_search"}]
      max_searches_per_call: null     # no documented per-call limit
    concurrency: 5
    timeout_seconds: 90
    pricing:
      input_per_mtok: 0.75            # through 2026-12-31
      output_per_mtok: 3.75           # through 2026-12-31
      search_per_call: 0.014          # $14 per 1,000 search queries after the free allowance
      free_searches_per_month: 5000   # shared across Gemini 3 and newer models
      assume_free_allowance: true     # estimate treats searches as free (see README)
      note: "Grounding with Google Search requires a paid-tier (billing enabled) project."
      price_changes:
        - effective: "2027-01-01"
          input_per_mtok: 1.50
          output_per_mtok: 7.50
    estimate:
      input_tokens: [300, 3000]
      output_tokens: [600, 2000]
      searches: [1, 3]

  perplexity:
    display_name: Perplexity
    verified: "2026-11-07"
    docs:
      - https://docs.perplexity.ai/guides/pricing
      - https://docs.perplexity.ai/docs/agent-api/migrate-from-sonar/how-to
      - https://docs.perplexity.ai/docs/agent-api/models
    api_key_env: PERPLEXITY_API_KEY
    model: perplexity/sonar
    api: agent                        # Agent API (Sonar Chat Completions support ended 2026-09-27)
    search:
      enabled: true
      tool: web_search                # required when a model is selected directly
      max_searches_per_call: null
    concurrency: 5
    timeout_seconds: 90
    pricing:
      input_per_mtok: 0.25
      output_per_mtok: 2.50
      search_per_call: 0.0025         # standard web_search, $2.50 per 1,000 invocations
    estimate:
      input_tokens: [3000, 12000]
      output_tokens: [400, 1200]
      searches: [1, 3]

# Models used for writing and classification (not measured engines).
helpers:
  verified: "2026-11-07"
  api_key_env: ANTHROPIC_API_KEY
  writer_model: claude-opus-5-5       # questions, findings, quick wins, outreach
  classifier_model: claude-haiku-5-5  # yes/no brand mention classifier
  pricing:
    claude-opus-5-5: { input_per_mtok: 4.00, output_per_mtok: 20.00 }
    claude-haiku-5-5: { input_per_mtok: 0.10, output_per_mtok: 0.50 }
  estimate_per_report_usd: [0.10, 0.40]

retry:
  max_attempts: 5
  base_delay_seconds: 2
  max_delay_seconds: 60
